# A throwaway view counter for running the e2e suite locally.
#
#   npm run e2e:local     bring this up, migrate it, run the suite against it
#   npm run db:down       destroy it
#
# Mirrors the postgres service in .github/workflows/e2e-on-demand.yml, so the
# counter specs exercise the same thing locally that they do on CI. Without a
# database those specs skip and their unavailable-path opposite numbers run
# instead, which is a real contract but only half of one.
#
# Host port 5433 rather than 5432, so this cannot collide with a postgres you
# already run. Storage is tmpfs: nothing survives the container, which is the
# point — every run starts from an empty counter.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: views_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d views_test']
      interval: 2s
      timeout: 3s
      retries: 15
